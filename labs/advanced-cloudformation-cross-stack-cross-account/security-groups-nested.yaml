AWSTemplateFormatVersion: '2010-09-09'
Description: Security groups child template (for nested stack use)

Parameters:
  # VPC ID passed from the parent stack
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to create security groups in

Resources:
  WebServerSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP/HTTPS from the internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: '0.0.0.0/0'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '0.0.0.0/0'
      Tags:
        - Key: Name
          Value: WebServerSG

  AppServerSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow port 8080 from web tier only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref WebServerSG
      Tags:
        - Key: Name
          Value: AppServerSG

Outputs:
  WebServerSecurityGroupId:
    Value: !Ref WebServerSG
  AppServerSecurityGroupId:
    Value: !Ref AppServerSG